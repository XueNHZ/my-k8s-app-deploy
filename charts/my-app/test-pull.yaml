apiVersion: v1
kind: Pod
metadata:
  name: test-pull
  namespace: my-app
spec:
  # 引用上面创建的拉取凭证
  imagePullSecrets:
    - name: harbor-secret
  containers:
    - name: test
      # 替换成你真实推送的镜像地址和 tag
      image: ${HARBOR_REGISTRY}/${HARBOR_PROJECT}/my-app:v1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 3600"]
