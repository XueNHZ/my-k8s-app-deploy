apiVersion: v1
kind: Pod
metadata:
  name: test-pull
  namespace: my-app
spec:
  # 引用集群中已创建的 harbor-secret
  imagePullSecrets:
    - name: harbor-secret
  containers:
    - name: test
      # 占位符：apply 前用 envsubst 渲染，或直接替换成真实镜像地址
      image: ${HARBOR_REGISTRY}/${HARBOR_PROJECT}/my-app:${IMAGE_TAG}
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 3600"]
