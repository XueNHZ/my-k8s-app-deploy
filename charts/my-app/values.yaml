replicaCount: 2
image:
  repository: ${HARBOR_REGISTRY}/${HARBOR_PROJECT}/my-app
  tag: "v10"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: false
  className: nginx
  host: my-app.example.com
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
